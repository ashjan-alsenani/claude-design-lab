<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>mockup</title>
<style>
  html, body { margin: 0; width: 1600px; height: 1000px; background: transparent; }
  .wrap { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }
  .laptop { position: absolute; top: 90px; left: 40px; width: 1260px; }
  .scr { height: 691px; border-radius: 30px 30px 0 0; border: 16px solid #e7e0ea; border-bottom: 0; overflow: hidden; background: #fff; }
  .scr img { width: 100%; display: block; }
  .base { height: 40px; margin: 0 -50px; border-radius: 0 0 46px 46px; background: linear-gradient(#ece6ef, #ddd5e2); box-shadow: 0 40px 80px -40px rgba(90,85,112,.55); }
  .phone { position: absolute; top: 200px; right: 40px; width: 360px; height: 740px; border-radius: 54px; border: 13px solid #e7e0ea; overflow: hidden; background: #fff; box-shadow: 0 50px 100px -40px rgba(90,85,112,.65); }
  .phone img { width: 100%; display: block; }
  window.render = 0;
</style></head>
<body><div class="wrap">
  <div class="laptop"><div class="scr"><img src="../assets/d-home.png" alt=""></div><div class="base"></div></div>
  <div class="phone"><img src="../assets/m-ideas-top.png" alt=""></div>
</div><script>window.render = () => {};</script></body></html>
