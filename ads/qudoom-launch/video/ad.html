<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>حكاية قدوم: إعلان</title>
<style>
  @font-face { font-family: Rubik; src: url(fonts/rubik-arabic-v1.woff2) format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; font-weight: 300 900; }
  @font-face { font-family: Rubik; src: url(fonts/rubik-latin-v1.woff2) format("woff2"); font-weight: 300 900; }
  :root { --bg: #fff9f4; --ink: #3f3b52; --soft: #6c6790; --pink: #c7366b; --pinkSoft: #ffe3ec; --sun: #fff1cc; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: Rubik, sans-serif; color: var(--ink); }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 620px; height: 620px; background: var(--sun); top: -180px; right: -220px; }
  .b2 { width: 520px; height: 520px; background: var(--pinkSoft); bottom: 120px; left: -240px; }
  .logo { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); height: 74px; }
  .cap { position: absolute; top: 200px; left: 70px; right: 70px; text-align: center; direction: rtl; }
  .small, .cta { direction: rtl; }
  .cap h1 { margin: 0; font-size: 82px; line-height: 1.18; font-weight: 800; }
  .cap h1 em { font-style: normal; color: var(--pink); }
  .cap p { margin: 22px 0 0; font-size: 44px; color: var(--soft); font-weight: 500; }
  .phone { position: absolute; left: 50%; top: 610px; width: 600px; height: 1220px; margin-left: -300px; border-radius: 72px; background: #fff; border: 16px solid #e7e0ea; box-shadow: 0 60px 120px -50px rgba(90, 85, 112, .55); overflow: hidden; }
  .phone img { position: absolute; top: 0; left: 0; width: 100%; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .end { text-align: center; }
  .laptop { position: absolute; top: 760px; left: 70px; width: 940px; }
  .laptop .scr { position: relative; height: 560px; border-radius: 28px 28px 0 0; border: 14px solid #e7e0ea; border-bottom: 0; overflow: hidden; background: #fff; }
  .laptop .scr img { width: 100%; display: block; }
  .laptop .base { height: 34px; margin: 0 -40px; border-radius: 0 0 40px 40px; background: #e7e0ea; }
  .mini { position: absolute; top: 980px; right: 60px; width: 290px; height: 590px; border-radius: 44px; border: 10px solid #e7e0ea; overflow: hidden; background: #fff; box-shadow: 0 40px 90px -40px rgba(90, 85, 112, .6); }
  .mini img { width: 100%; display: block; }
  .cta { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); background: var(--pink); color: #fff; font-size: 48px; font-weight: 800; padding: 30px 64px; border-radius: 999px; white-space: nowrap; }
  .small { position: absolute; bottom: 84px; left: 0; right: 0; text-align: center; font-size: 30px; color: var(--soft); }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<img class="logo" src="oneclick-logo-light.svg" alt="">

<div id="scenes"></div>

<div class="scene end" id="end">
  <div class="cap" style="top: 230px"><h1>حكاية قدوم <em>على OneClick</em></h1><p>كل تجهيزات البيبي… في مكان واحد</p></div>
  <div class="laptop"><div class="scr"><img src="../assets/d-home.png" alt=""></div><div class="base"></div></div>
  <div class="mini"><img src="../assets/m-ideas-top.png" alt=""></div>
  <div class="cta">اكتشفيها الآن</div>
  <div class="small">على الجوال والكمبيوتر · الرابط في البايو</div>
</div>

<script>
  // Scenes: [start, end, title (HTML), subtitle, phone screenshot, scroll (0..1 of the extra height)]
  const S = [
    [0, 4.2, 'صغيرك <em>جاي</em>… ومليون شي تبين تجهزينه؟', 'خليها علينا', 'm-home', 0],
    [4.2, 8.4, 'لوحة وحدة <em>توريك كل شي</em>', 'الأيام الباقية · جاهزيتك · وش عليك اليوم', 'm-home', 0.25],
    [8.4, 12.4, '<em>خطوة بخطوة</em>', 'تعرفين من وين تبدين ووش بعدها', 'm-steps', 0.15],
    [12.4, 16.6, 'أكثر من <em>١١٠٠ فكرة</em>', 'توزيعات وهدايا وضيافة… بصورها', 'm-ideas-list', 0.1],
    [16.6, 20.8, 'شوفي الشكل… <em>ووين تلاقينها</em>', 'محلات قريبة في مدينتك بضغطة', 'm-idea-sheet', 0.3],
    [20.8, 24.6, 'تنبيهات لطيفة: <em>لا تنسين</em>', 'مواعيدك وشنطة المستشفى والزيارات', 'm-reminders', 0],
  ];
  const END = [24.6, 30];
  const wrap = document.getElementById('scenes');
  for (const [a, b, h, p, img] of S) {
    const d = document.createElement('div'); d.className = 'scene';
    d.innerHTML = `<div class="cap"><h1>${h}</h1><p>${p}</p></div><div class="phone"><img src="../assets/${img}.png" alt=""></div>`;
    wrap.appendChild(d);
  }
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  window.render = (t) => {
    [...wrap.children].forEach((el, i) => {
      const [a, b, , , , scroll] = S[i];
      const vis = t >= a - 0.01 && t < b;
      const k = ease((t - a) / 0.5), out = ease((t - (b - 0.35)) / 0.35);
      el.style.opacity = vis ? String(Math.min(k, 1 - out)) : '0';
      const cap = el.querySelector('.cap'), ph = el.querySelector('.phone'), im = ph.querySelector('img');
      cap.style.transform = `translateY(${(1 - k) * 40}px)`;
      ph.style.transform = `translateY(${(1 - k) * 120}px) scale(${0.96 + 0.04 * k})`;
      const extra = Math.max(0, im.naturalHeight * (ph.clientWidth / im.naturalWidth) - ph.clientHeight);
      im.style.transform = `translateY(${-extra * scroll * ease((t - a - 0.8) / (b - a - 1.2))}px)`;
    });
    const e = document.getElementById('end');
    const k = ease((t - END[0]) / 0.7);
    e.style.opacity = t >= END[0] ? String(k) : '0';
    e.querySelector('.laptop').style.transform = `translateY(${(1 - k) * 80}px)`;
    e.querySelector('.mini').style.transform = `translateY(${(1 - ease((t - END[0] - 0.3) / 0.7)) * 140}px) rotate(-3deg)`;
    e.querySelector('.cta').style.transform = `translateX(-50%) scale(${0.9 + 0.1 * ease((t - END[0] - 0.8) / 0.5)})`;
  };
  window.render(0);
</script>
</body>
</html>
