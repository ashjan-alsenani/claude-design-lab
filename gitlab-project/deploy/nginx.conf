# Static hosting for the employee directory. The site is served under ${BASE_PATH} (default /employee-directory/).
# nginx-unprivileged runs as a non-root user and listens on 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Relative redirects, so they stay correct behind a load balancer or a different published port.
  absolute_redirect off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = / { return 302 ${BASE_PATH}; }

  location ${BASE_PATH} {
    try_files $uri $uri/ =404;
    # Updates must reach browsers: code, styles, the page, the service worker and the settings file are always
    # revalidated (file names aren't fingerprinted). Images and fonts may be cached for an hour.
    location ~ \.(html|js|css|webmanifest)$ { add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "same-origin" always; add_header X-Frame-Options "DENY" always; }
    location ~* \.(png|jpg|woff2)$ { expires 1h; }
  }
}
