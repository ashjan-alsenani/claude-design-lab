# GitLab CI/CD for the employee directory (static web app).
#
# Stages run on every push: check -> build -> test.
# The container image is built only when BUILD_IMAGE is "true".
# Production deployment is OFF until IT sets DEPLOY_ENABLED to "true" and fills in deploy/deploy.sh.
# See docs/IT-SETUP.md for every variable.
#
# Images are pulled from Docker Hub and the Microsoft registry by default. If your runners can't reach them,
# set NODE_IMAGE, PLAYWRIGHT_IMAGE and NGINX_IMAGE to mirrors in your internal registry.

variables:
  NODE_IMAGE: "node:22-bookworm-slim"
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.63.0-noble"   # must match devDependencies.playwright
  NGINX_IMAGE: "nginxinc/nginx-unprivileged:1.27-alpine"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  BASE_PATH: "/employee-directory/"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Fictional owner used only to test sign-in inside the pipeline; never deployed.
  TEST_OWNER_USERNAME: "ci.owner"
  TEST_OWNER_PASSWORD: "ci-only-test-password-2026"

stages: [check, build, test, package, deploy]

default:
  interruptible: true

.npm:
  image: $NODE_IMAGE
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  before_script:
    - node --version
    - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund

check:
  stage: check
  extends: .npm
  script:
    - npm run build
    - npm run check

build:
  stage: build
  extends: .npm
  script:
    # Production settings come from protected, masked CI/CD variables (OWNER_*, CREDIT_*).
    # On the default branch the build fails if the owner account isn't configured.
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ "$DEPLOY_ENABLED" = "true" ]; then export REQUIRE_OWNER=true; fi
    - npm run build:single
  artifacts:
    name: "employee-directory-$CI_COMMIT_SHORT_SHA"
    paths: [dist/, dist-single/]
    expire_in: 30 days

browser-tests:
  stage: test
  image: $PLAYWRIGHT_IMAGE
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  script:
    - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --no-audit --no-fund
    # Build a test copy with the fictional CI owner (not the production settings).
    - export OWNER_USERNAME="$TEST_OWNER_USERNAME" OWNER_PASSWORD_SHA256="$(printf '%s' "$TEST_OWNER_PASSWORD" | node scripts/hash-password.mjs)" OWNER_DISPLAY_NAME="CI Owner"
    - npm run build
    - (PORT=8080 BASE_PATH="$BASE_PATH" node scripts/serve.mjs > serve.log 2>&1 &)
    - for i in $(seq 1 30); do node -e "fetch('http://127.0.0.1:8080$BASE_PATH').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break; sleep 1; done
    - BASE_URL="http://127.0.0.1:8080$BASE_PATH" npm test
  artifacts:
    when: on_failure
    paths: [tests/*.png, serve.log]
    expire_in: 7 days

container-image:
  stage: package
  needs: [build]
  image: { name: $KANIKO_IMAGE, entrypoint: [""] }
  rules:
    - if: '$BUILD_IMAGE == "true" && $CI_REGISTRY_IMAGE'
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile deploy/Dockerfile
      --build-arg NGINX_IMAGE="$NGINX_IMAGE" --build-arg BASE_PATH="$BASE_PATH"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      $( [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && echo --destination "$CI_REGISTRY_IMAGE:latest" )

deploy-production:
  stage: deploy
  needs: [build, browser-tests]
  image: $NODE_IMAGE
  environment: { name: production, url: $PRODUCTION_URL }
  rules:
    # Disabled until IT supplies the company settings. Even then it runs only on the default branch, by hand.
    - if: '$DEPLOY_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - sh deploy/deploy.sh
