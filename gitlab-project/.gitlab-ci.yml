# GitLab CI/CD for the employee directory.
#
#   check  → type checks and static checks
#   test   → server tests against a PostgreSQL service, browser tests (standalone + shared version)
#   build  → container image (UBI Node.js) pushed to the project's container registry
#   deploy → OpenShift; OFF until IT sets DEPLOY_ENABLED=true and the OPENSHIFT_* variables. Manual, default branch only.
#
# Images come from Docker Hub, Microsoft and Red Hat registries by default. If your runners can't reach them,
# point the *_IMAGE variables at internal mirrors. See docs/IT-SETUP.md.

variables:
  NODE_IMAGE: "node:22-bookworm-slim"
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.63.0-noble"   # must match devDependencies.playwright
  POSTGRES_IMAGE: "postgres:16-alpine"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  OC_IMAGE: "quay.io/openshift/origin-cli:4.16"
  UBI_NODE_IMAGE: "registry.access.redhat.com/ubi9/nodejs-22:latest"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  # Throwaway test database for the jobs below (a CI service container, not company data).
  POSTGRES_DB: directory_ci
  POSTGRES_USER: directory
  POSTGRES_PASSWORD: ci-only-password
  CI_DATABASE_URL: "postgres://directory:ci-only-password@postgres:5432/directory_ci"

stages: [check, test, build, deploy]

default:
  interruptible: true
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]

check:
  stage: check
  image: $NODE_IMAGE
  script:
    - npm ci --no-audit --no-fund
    - npm run check
    - npm run build
  artifacts:
    paths: [dist/, server-dist/]
    expire_in: 7 days

tests:
  stage: test
  image: $PLAYWRIGHT_IMAGE
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  script:
    - npm ci --no-audit --no-fund
    - npm run build && npm run build:test
    - TEST_DATABASE_URL="$CI_DATABASE_URL" npm run test:server
    - npm run test:e2e
    - E2E_DATABASE_URL="$CI_DATABASE_URL" npm run test:e2e:server
  artifacts:
    when: on_failure
    paths: [test-output/]
    expire_in: 7 days

image:
  stage: build
  needs: [check, tests]
  image: { name: $KANIKO_IMAGE, entrypoint: [""] }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_REGISTRY_IMAGE
    - if: $BUILD_IMAGE == "true" && $CI_REGISTRY_IMAGE
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile
      --build-arg NODE_IMAGE="$UBI_NODE_IMAGE"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      $( [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && echo --destination "$CI_REGISTRY_IMAGE:latest" )

deploy-openshift:
  stage: deploy
  needs: [image]
  image: { name: $OC_IMAGE, entrypoint: [""] }
  environment: { name: production, url: $PRODUCTION_URL }
  resource_group: production
  rules:
    # Disabled until IT supplies the settings. Then: default branch only, started by hand.
    - if: $DEPLOY_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - test -n "$OPENSHIFT_SERVER" && test -n "$OPENSHIFT_TOKEN" && test -n "$OPENSHIFT_PROJECT" || { echo "Set OPENSHIFT_SERVER, OPENSHIFT_TOKEN and OPENSHIFT_PROJECT"; exit 1; }
    - oc login --server="$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" ${OPENSHIFT_CA_FILE:+--certificate-authority="$OPENSHIFT_CA_FILE"}
    - oc project "$OPENSHIFT_PROJECT"
    - oc get secret employee-directory-secrets >/dev/null || { echo "Create the employee-directory-secrets Secret first (openshift/secret.example.yaml)"; exit 1; }
    - cd openshift && sed -i "s#newName: .*#newName: $CI_REGISTRY_IMAGE#; s#newTag: .*#newTag: $CI_COMMIT_SHORT_SHA#" kustomization.yaml && cd ..
    - oc apply -k openshift/
    - oc rollout status deployment/employee-directory --timeout=180s
