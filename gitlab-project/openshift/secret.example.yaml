# EXAMPLE ONLY. Don't commit real values. Create the Secret directly instead:
#   oc create secret generic employee-directory-secrets \
#     --from-literal=DATABASE_URL='postgres://USER:PASSWORD@HOST:5432/DBNAME' \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=OIDC_CLIENT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: employee-directory-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/DBNAME
  SESSION_SECRET: REPLACE-WITH-64-RANDOM-HEX-CHARACTERS
  OIDC_CLIENT_SECRET: REPLACE
