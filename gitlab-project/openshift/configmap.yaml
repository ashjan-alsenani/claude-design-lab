# Non-secret settings. Secrets (DATABASE_URL, SESSION_SECRET, OIDC_CLIENT_SECRET) go in the Secret: see secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: employee-directory-config
data:
  NODE_ENV: production
  BASE_PATH: /employee-directory/
  PUBLIC_URL: https://REPLACE-WITH-ROUTE-HOST          # e.g. https://directory.apps.cluster.example
  AUTH_MODE: oidc
  OIDC_ISSUER_URL: https://login.microsoftonline.com/REPLACE-TENANT-ID/v2.0
  OIDC_CLIENT_ID: REPLACE-CLIENT-ID
  OIDC_SCOPES: openid profile email
  OIDC_EMAIL_CLAIM: preferred_username
  OIDC_NAME_CLAIM: name
  OIDC_ALLOWED_GROUPS: ""
  ADMIN_EMAILS: REPLACE-first.admin@company.example
  DEFAULT_ROLE: none
  INITIAL_DATA: empty
  DATABASE_SSL: require
  SESSION_IDLE_MINUTES: "30"
  SESSION_MAX_HOURS: "10"
  TRUST_PROXY: "1"
  LOG_LEVEL: info
